<html>
<head>
    <title>Basic Chat 2</title>
</head>
<body style="background-color: whitesmoke;">
    <h1 style="color: rebeccapurple; font-family: Arial, sans-serif;">Basic Chat 2</h1>
    <p style="color: rebeccapurple">Beta v2.5</p>
    <div id="chatbox" style="width: 500px; height: 650px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; color: rebeccapurple; font-family: Arial, sans-serif;"></div>
    <input style="width: 130px; height: 20px; background-color: whitesmoke; color: rebeccapurple;" type="text" id="usernameInput" autocomplete="off" placeholder="username">
    <input style="width: 130px; height: 20px; background-color: whitesmoke; color: rebeccapurple;" type="text" id="messageInput" autocomplete="off" placeholder="message">
    <button style="width: 130px; height: 20px; background-color: whitesmoke; color: rebeccapurple;" onclick="sendMessage()">Send</button>
    <script>
        const chatbox = document.getElementById("chatbox");
        function sendMessage() {
            const usernameInput = document.getElementById("usernameInput");
            const messageInput = document.getElementById("messageInput");
            fetch("/sendMsg", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: usernameInput.value,
                    message: messageInput.value
                })
            })
        }
        function scrollToBottom() {
            chatbox.scrollTop = chatbox.scrollHeight;
        }
        async function fetchMessages() {
            const response = await fetch("/getMsg");
            const messages = await response.json();
            chatbox.innerHTML = "";
            messages.forEach(msg => {
                const messageElement = document.createElement("p");
                messageElement.innerHTML = `${msg.username}: ${msg.message}`;
                chatbox.appendChild(messageElement);
            });

        }
        document.addEventListener("beforeunLoad", async function() {
            chatbox.innerHTML += `<p style='color: red;'>${usernameInput.value} has left the chat.</p>`;
        });
        setInterval(fetchMessages, 1000);
        async function resetMessages() {
            await fetch("/resetMsg", { method: "POST" });
            chatbox.innerHTML = "";
        }
        setInterval(resetMessages, 300000);
        setInterval(scrollToBottom, 500);
    </script>
</body>
</html>

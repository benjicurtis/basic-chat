<!DOCTYPE html>
<html>
    <head>
        <title>Basic Chat</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body style="background-color: peachpuff;">
        <h1 class="title">Basic Chat 2</h1>
        <p class="text" >v5.0</p>
        <input  class="rounded-box" id="usernameBox" placeholder="username"/>
        <input  class="rounded-box" id="msgBox" placeholder="message"/>
        <button id="sendBtn" onclick="send()" class="rounded-box">Send</button>
        <div id="chatbox" class="chatbox"></div>
        <script>
        function send(){
            const username = document.getElementById("usernameBox")
            const message = document.getElementById("msgBox")
            const chatbox = document.getElementById("chatbox")
                fetch("/messageSent", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify ({
                    username: username.value,
                    message: message.value
                })
            })
        }
        async function getMsg(){
            const chatbox = document.getElementById("chatbox")
            const response = await fetch("/getMsg");
            const data = await response.json();
            chatbox.innerHTML = "";
            data.forEach(message => {
                const chatElement = document.createElement("p");
                chatElement.innerHTML = `${message.username}: ${message.message}`;
                chatbox.appendChild(chatElement)
            });
        }
        setInterval(getMsg, 1000)
        </script>
    </body>
</html>

<html>
<head>
    <style>
    </style>
</head>
<body>
    <h1>basic chat v2</h1>
    <title>Basic Chat v2</title>
    <p>beta v1</p>
    <div id="chatbox" style="width: 400px; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px;"></div>
    <input type="text" id="usernameInput" autocomplete="off" placeholder="Type your username here..." style="width: 300px;">
    <input type="text" id="messageInput" autocomplete="off" placeholder="Type your message here..." style="width: 300px;">
    <button onclick="sendMessage()">Send</button>
    <script>
        const chatbox = document.getElementById("chatbox");
        function sendMessage() {
            const usernameInput = document.getElementById("usernameInput");
            const messageInput = document.getElementById("messageInput");
            fetch("/sendMsg", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: usernameInput.value,
                    message: messageInput.value
                })
            })
        }
        async function fetchMessages() {
            const response = await fetch("/getMsg");
            const messages = await response.json();
            chatbox.innerHTML = "";
            messages.forEach(msg => {
                const messageElement = document.createElement("p");
                messageElement.textContent = `${msg.username}: ${msg.message}`;
                chatbox.appendChild(messageElement);
            });
        }
        setInterval(fetchMessages, 1000);
    </script>
</body>
</html>
